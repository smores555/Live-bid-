<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>737 Master Position Bid</title>

<script src="engine.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
  :root {
    --bg:#0b0e14; --card:#161b22; --sunk:#0d1117; --border:#30363d;
    --text:#c9d1d9; --dim:#8b949e; --accent:#58a6ff;
    --green:#3fb950; --red:#f85149; --yellow:#d29922; --purple:#bc8cff; --orange:#db6d28;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  * { box-sizing:border-box; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg); color:var(--text); margin:0; padding:24px 20px 80px;
    line-height:1.5; font-size:14px;
  }
  .wrap { max-width:1500px; margin:0 auto; }

  header { display:flex; align-items:baseline; gap:14px; margin-bottom:22px; flex-wrap:wrap; }
  h1 { font-size:1.15rem; margin:0; letter-spacing:.02em; }
  .subtitle { color:var(--dim); font-size:.8rem; }

  .card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:16px; margin-bottom:18px; }
  .card h2 { font-size:.75rem; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:0 0 12px; font-weight:600; }

  .cap-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .cap-cell label { display:block; font-size:.7rem; color:var(--dim); margin-bottom:4px; font-family:var(--mono); }
  .cap-cell input {
    width:100%; background:var(--sunk); border:1px solid var(--border); color:var(--green);
    padding:7px 8px; border-radius:5px; font-weight:600; font-family:var(--mono); font-size:.85rem;
  }
  .cap-cell input:focus { outline:2px solid var(--accent); outline-offset:-1px; }

  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-bottom:18px; }
  .stat { background:var(--card); padding:12px 14px; }
  .stat .n { font-family:var(--mono); font-size:1.35rem; font-weight:600; display:block; }
  .stat .l { font-size:.68rem; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); }

  .toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:18px; }
  .btn { background:var(--accent); color:#04121f; border:0; padding:9px 16px; border-radius:6px; font-weight:600; cursor:pointer; font-size:.82rem; }
  .btn:hover { filter:brightness(1.12); }
  .btn.ghost { background:transparent; color:var(--text); border:1px solid var(--border); }
  .btn.ghost:hover { border-color:var(--accent); color:var(--accent); filter:none; }
  .btn:disabled { opacity:.4; cursor:not-allowed; filter:none; }
  select, .search {
    background:var(--sunk); border:1px solid var(--border); color:var(--text);
    padding:8px 10px; border-radius:6px; font-size:.82rem; font-family:inherit;
  }
  .search { width:190px; }
  .spacer { flex:1 1 auto; }

  table { width:100%; border-collapse:collapse; }
  thead th {
    background:var(--card); color:var(--dim); text-align:left; padding:9px 12px;
    font-size:.68rem; text-transform:uppercase; letter-spacing:.07em; font-weight:600;
    position:sticky; top:0; border-bottom:1px solid var(--border); z-index:2;
  }
  td { padding:7px 12px; font-size:.82rem; vertical-align:top; }
  tbody tr.first td { border-top:1px solid var(--border); }
  .sen, .pos, .pref { font-family:var(--mono); }
  .sen { font-weight:600; }
  .pos { color:var(--dim); }
  .pref { text-align:center; color:var(--dim); }
  .note { color:var(--dim); font-size:.78rem; }
  .name { font-weight:600; }
  .status { font-weight:600; font-size:.72rem; text-transform:uppercase; letter-spacing:.04em; }
  .s-Awarded { color:var(--green); }
  .s-Denied { color:var(--red); }
  .s-Displaced { color:var(--purple); }
  .s-Reduction { color:var(--yellow); }
  .s-NoBid { color:var(--dim); }
  .s-Insufficient { color:var(--orange); }
  .tag { font-size:.6rem; font-weight:700; padding:2px 5px; border-radius:3px; margin-left:6px; text-transform:uppercase; letter-spacing:.04em; }
  .t-mover { background:var(--green); color:#04140a; }
  .t-disp { background:var(--purple); color:#150a24; }
  .t-paper { background:var(--border); color:var(--text); }
  .empty { padding:36px; text-align:center; color:var(--dim); }
  .more { padding:14px; text-align:center; }
  .err { border-left:3px solid var(--red); padding:14px; background:var(--card); color:var(--red); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>737 Master Position Bid</h1>
    <span class="subtitle" id="subtitle">Loading source data…</span>
  </header>

  <div class="card">
    <h2>Position deltas</h2>
    <div class="cap-grid" id="capGrid"></div>
  </div>

  <div class="toolbar">
    <button id="runBtn" class="btn" disabled>Run bid</button>
    <button id="expLog" class="btn ghost" disabled>Transaction log</button>
    <button id="expMaster" class="btn ghost" disabled>Master awards</button>
    <button id="expBase" class="btn ghost" disabled>Base lists</button>
    <span class="spacer"></span>
    <select id="filter">
      <option value="changes">Position changes only</option>
      <option value="all">All pilots</option>
      <option value="displaced">Reduced &amp; displaced</option>
      <option value="denied">Any denial</option>
      <option value="paper">Paper bids</option>
    </select>
    <input class="search" id="search" placeholder="Seniority or name">
  </div>

  <div class="stats" id="stats"></div>

  <div class="card" id="openPositionsCard" style="display:none;">
    <h2>Open positions</h2>
    <table>
      <thead>
        <tr>
          <th>Position</th><th>Cap</th><th>Filled</th><th>Open</th><th>Min seniority</th>
        </tr>
      </thead>
      <tbody id="openPositionsBody"></tbody>
    </table>
  </div>

  <div class="card" style="padding:0; overflow:hidden;">
    <table>
      <thead>
        <tr>
          <th style="width:70px">Sen</th>
          <th style="width:200px">Pilot</th>
          <th style="width:105px">From</th>
          <th style="width:105px">Bid</th>
          <th style="width:70px">Pref</th>
          <th style="width:95px">Status</th>
          <th>Award note</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="7" class="empty">Set your deltas, then run the bid.</td></tr>
      </tbody>
    </table>
    <div class="more" id="more"></div>
  </div>

</div>

<script>
/* ===========================================================================
 * Data loading, rendering and export. All award logic lives in engine.js.
 * ======================================================================== */

var BID_TITLE  = 'Bid 2026-10 Results';
var BID_HEADER = 'Awarded May 20, 2026, Seniority based on February 5, 2026, Seniority List';
var BID_NOTE   = 'Anyone with N/A as their Starting or Bid Position has a Current Position ' +
                 'that no longer exists and will fall under CBA section 24.K upon their return.';

var store   = null;
var result  = null;
var pageSize = 250;
var shown    = pageSize;

var $ = function (id) { return document.getElementById(id); };

// ── Load ──────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', function () {
  var required = ['roster.json', 'preferences.json', 'capacities.json',
                  'retired_pilots.json', 'nobidpilots.json'];

  Promise.all(required.map(function (f) {
    return fetch(f).then(function (r) {
      if (!r.ok) throw new Error(f + ' — ' + r.status);
      return r.json();
    });
  })).then(function (res) {
    // Paper bidders are optional: without the file every off-manning pilot is
    // treated as a straight no-bid, which shifts vacancy counts.
    return fetch('paperbid_pilots.json')
      .then(function (r) { return r.ok ? r.json() : []; })
      .catch(function () { return []; })
      .then(function (paper) {
        store = {
          roster: res[0], prefs: res[1], caps: res[2],
          retired: res[3], noBid: res[4], paperBid: paper
        };
        renderCapacities();
        $('runBtn').disabled = false;
        $('subtitle').textContent =
          store.roster.length + ' pilots · ' + store.noBid.length + ' no-bid · ' +
          paper.length + ' paper-bid' +
          (paper.length ? '' : ' (paperbid_pilots.json not found)');
      });
  }).catch(function (e) {
    document.querySelector('.wrap').innerHTML =
      '<div class="err">Could not load source data: ' + e.message +
      '<br><br>Serve this folder over HTTP — opening index.html from the file system ' +
      'blocks fetch().</div>';
  });
});

function renderCapacities() {
  $('capGrid').innerHTML = store.caps.map(function (c) {
    return '<div class="cap-cell"><label>' + c.base + ' ' + c.seat +
           ' &middot; cap ' + c.startCapacity + '</label>' +
           '<input type="number" id="d-' + c.base + '-' + c.seat +
           '" value="' + (c.delta || 0) + '"></div>';
  }).join('');
}

// ── Run ───────────────────────────────────────────────────────────────────
$('runBtn').onclick = function () {
  var deltas = {};
  store.caps.forEach(function (c) {
    var el = $('d-' + c.base + '-' + c.seat);
    deltas[c.base + '-' + c.seat] = el ? (parseInt(el.value, 10) || 0) : 0;
  });

  $('runBtn').disabled = true;
  $('runBtn').textContent = 'Running…';

  setTimeout(function () {
    result = runBidEngine(store, deltas);
    ['expLog', 'expMaster', 'expBase'].forEach(function (id) { $(id).disabled = false; });
    $('runBtn').disabled = false;
    $('runBtn').textContent = 'Run bid';
    renderStats();
    renderOpenPositions();
    shown = pageSize;
    renderTable();
  }, 20);
};

function renderStats() {
  var s = result.stats;
  var left = Object.keys(result.vacancies).filter(function (k) { return result.vacancies[k] !== 0; });
  var cells = [
    ['Transactions', s.transactions, ''],
    ['Awarded', s.awarded, 'var(--green)'],
    ['Denied', s.denied, 'var(--red)'],
    ['No bid', s.noBid, 'var(--dim)'],
    ['Reductions', s.reductions, 'var(--yellow)'],
    ['Displaced', s.displacements, 'var(--purple)'],
    ['Movers', s.movers, 'var(--accent)'],
    ['Unfilled', left.length, left.length ? 'var(--red)' : 'var(--green)']
  ];
  $('stats').innerHTML = cells.map(function (c) {
    return '<div class="stat"><span class="n" style="color:' + (c[2] || 'var(--text)') +
           '">' + c[1] + '</span><span class="l">' + c[0] + '</span></div>';
  }).join('');
}

function renderOpenPositions() {
  var order = ['SEA-CA', 'SEA-FO', 'PDX-CA', 'PDX-FO', 'ANC-CA', 'ANC-FO',
               'LAX-CA', 'LAX-FO', 'SFO-CA', 'SFO-FO'];
  var open = order.filter(function (k) { return result.positions[k].open > 0; });

  if (!open.length) {
    $('openPositionsCard').style.display = 'none';
    return;
  }
  $('openPositionsCard').style.display = 'block';
  $('openPositionsBody').innerHTML = open.map(function (k) {
    var p = result.positions[k];
    return '<tr><td class="pos">737 ' + k.replace('-', ' ') + '</td>' +
           '<td class="pref">' + p.cap + '</td>' +
           '<td class="pref">' + p.filled + '</td>' +
           '<td class="pref" style="color:var(--green);font-weight:600">' + p.open + '</td>' +
           '<td class="pref">' + (p.minSeniority || '—') + '</td></tr>';
  }).join('');
}

// ── Table ─────────────────────────────────────────────────────────────────
$('filter').onchange = function () { shown = pageSize; renderTable(); };
$('search').oninput  = function () { shown = pageSize; renderTable(); };

function matches(p) {
  var q = $('search').value.trim().toLowerCase();
  if (q && String(p.sen) !== q && p.name.toLowerCase().indexOf(q) === -1) return false;

  switch ($('filter').value) {
    case 'all':       return true;
    case 'changes':   return p.moved || p.wasDisplaced;
    case 'displaced': return p.wasDisplaced;
    case 'denied':    return p.rows.some(function (r) { return r.status === 'Denied'; });
    case 'paper':     return p.isPaper;
  }
  return true;
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
  });
}

function statusClass(s) {
  if (s === 'No Bid') return 's-NoBid';
  if (s === 'Insufficient Bids') return 's-Insufficient';
  return 's-' + s;
}

function renderTable() {
  var list = result.roster.filter(matches);
  var page = list.slice(0, shown);

  if (!page.length) {
    $('tbody').innerHTML = '<tr><td colspan="7" class="empty">No pilots match this filter.</td></tr>';
    $('more').innerHTML = '';
    return;
  }

  $('tbody').innerHTML = page.map(function (p) {
    var tags = (p.moved ? '<span class="tag t-mover">Mover</span>' : '') +
               (p.wasDisplaced ? '<span class="tag t-disp">Displaced</span>' : '') +
               (p.isPaper ? '<span class="tag t-paper">Paper</span>' : '');

    return p.rows.map(function (r, i) {
      var first = i === 0;
      return '<tr' + (first ? ' class="first"' : '') + '>' +
        (first ? '<td rowspan="' + p.rows.length + '" class="sen">' + p.sen + '</td>' +
                 '<td rowspan="' + p.rows.length + '"><span class="name">' + esc(p.name) +
                 '</span>' + tags + '</td>' : '') +
        '<td class="pos">' + esc(r.startPos || 'N/A') + '</td>' +
        '<td class="pos">' + esc(r.bidPos || 'N/A') + '</td>' +
        '<td class="pref">' + esc(r.prefLabel) + '</td>' +
        '<td class="status ' + statusClass(r.status) + '">' + esc(r.status) + '</td>' +
        '<td class="note">' + esc(r.note) + '</td>' +
      '</tr>';
    }).join('');
  }).join('');

  $('more').innerHTML = list.length > shown
    ? '<button class="btn ghost" onclick="showMore()">Show more — ' +
      (list.length - shown) + ' pilots remaining</button>'
    : '<span class="note">' + list.length + ' pilots shown</span>';
}

function showMore() { shown += pageSize * 2; renderTable(); }

// ── Export helpers ────────────────────────────────────────────────────────
function sheetFromRows(rows, widths) {
  var ws = XLSX.utils.aoa_to_sheet(rows);
  if (widths) ws['!cols'] = widths.map(function (w) { return { wch: w }; });
  return ws;
}

function download(ws, sheetName, filename) {
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  XLSX.writeFile(wb, filename);
}

// ── Transaction log — matches the company file layout exactly ─────────────
$('expLog').onclick = function () {
  var rows = [
    [BID_TITLE], [BID_HEADER], [BID_NOTE],
    ['Transaction_ID', 'Seniority', 'Pilot Name', 'Starting Position',
     'Bid Position', 'Bid Preference', 'Award Status', 'Award Note']
  ];
  result.transactions.forEach(function (r) {
    rows.push([r.id, r.sen, r.name, r.startPos, r.bidPos, r.prefLabel, r.status, r.note]);
  });
  download(sheetFromRows(rows, [14, 10, 26, 17, 17, 14, 17, 95]),
           'Transaction Log', 'transaction_log.xlsx');
};

// ── Master awards — one row per pilot ─────────────────────────────────────
$('expMaster').onclick = function () {
  var rows = [['Seniority', 'Pilot Name', 'Starting Position', 'Awarded Position',
               'Pref #', 'BPL', 'Result', 'Award Note']];

  var bplRank = {};
  Object.keys(result.positions).forEach(function (key) {
    result.positions[key].holders.forEach(function (h, i) { bplRank[h.sen] = i + 1; });
  });

  result.roster.forEach(function (p) {
    p._bpl = bplRank[p.sen] || '';
    rows.push([
      p.sen, p.name,
      p.orig ? '737 ' + p.orig.replace('-', ' ') : 'N/A',
      p.finalPos || 'UNASSIGNED',
      p.awardedPrefNum === null ? '' : p.awardedPrefNum,
      p._bpl || '',
      p.isNoBid ? 'No Bid' : p.moved ? 'Moved' : p.wasDisplaced ? 'Displaced' : 'Held',
      p.note
    ]);
  });

  download(sheetFromRows(rows, [10, 26, 17, 17, 8, 7, 12, 95]),
           'Master Awards', 'master_awards.xlsx');
};

// ── Base lists — one sheet per base, CA and FO side by side ───────────────
// Each column is padded out to full capacity with VACANCY rows, BPL number
// continuing straight on from the last awarded pilot, so an empty slot's
// base/seat and rank are as visible as a filled one.
function bplColumn(key) {
  var p = result.positions[key];
  var rows = p.holders.map(function (h, i) { return [i + 1, h.name, h.sen]; });
  for (var i = p.filled; i < p.cap; i++) rows.push([i + 1, 'VACANCY', '']);
  return rows;
}

$('expBase').onclick = function () {
  var baseNames = { ANC: 'Anchorage', SEA: 'Seattle', LAX: 'Los Angeles',
                    SAN: 'San Diego', SFO: 'San Francisco', PDX: 'Portland' };
  var wb = XLSX.utils.book_new();

  ['SEA', 'PDX', 'ANC', 'LAX', 'SFO', 'SAN'].forEach(function (base) {
    var caKey = base + '-CA', foKey = base + '-FO';
    if (!result.positions[caKey] && !result.positions[foKey]) return;
    var ca = result.positions[caKey] ? bplColumn(caKey) : [];
    var fo = result.positions[foKey] ? bplColumn(foKey) : [];
    if (!ca.length && !fo.length) return;

    var rows = [
      ['737 ' + (baseNames[base] || base).toUpperCase(), '', '', '', '', ''],
      ['Captain  (cap ' + (result.targetMap[caKey] || 0) + ', ' +
        (result.positions[caKey] ? result.positions[caKey].open : 0) + ' open)', '', '',
       'First Officer  (cap ' + (result.targetMap[foKey] || 0) + ', ' +
        (result.positions[foKey] ? result.positions[foKey].open : 0) + ' open)', '', ''],
      ['BPL', 'Name', 'Sen', 'BPL', 'Name', 'Sen']
    ];
    for (var i = 0; i < Math.max(ca.length, fo.length); i++) {
      var c = ca[i] || ['', '', ''], f = fo[i] || ['', '', ''];
      rows.push([c[0], c[1], c[2], f[0], f[1], f[2]]);
    }
    XLSX.utils.book_append_sheet(wb, sheetFromRows(rows, [6, 28, 8, 6, 28, 8]), base);
  });

  XLSX.writeFile(wb, 'base_lists.xlsx');
};
</script>
</body>
</html>
